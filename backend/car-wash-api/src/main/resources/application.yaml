server:
  port: ${PORT:8080}

spring:
  application:
    name: car-wash-api
    

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/car_wash_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  admin:
    email: ${ADMIN_EMAIL:admin@carwash.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    firstName: ${ADMIN_FIRSTNAME:Admin}
    lastName: ${ADMIN_LASTNAME:User}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    seed-on-startup: true