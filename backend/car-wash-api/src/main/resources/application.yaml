server:
  port: 8080

spring:
  application:
    name: car-wash-api
    

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/car_wash_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  admin:
    email: ${ADMIN_EMAIL:admin@carwash.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    firstName: ${ADMIN_FIRST_NAME:Admin}
    lastName: ${ADMIN_LAST_NAME:User}
  demo:
    seed-on-startup: true