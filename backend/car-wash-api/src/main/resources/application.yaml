server:
  port: 8080

spring:
  application:
    name: car-wash-api

  datasource:
    url: jdbc:postgresql://localhost:5432/car_wash_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never